<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangGraphChat</title>
    <link rel="stylesheet" href="/static/styles.css?v=4">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">
                <strong>LangGraphChat</strong>
                <span>Conversations with context</span>
            </div>
            <button class="new-thread" id="newThread">+ New thread</button>
            <p class="thread-heading">Threads</p>
            <nav class="thread-list" id="threadList" aria-label="Conversation threads"></nav>
        </aside>
        <main class="main">
            <header class="header">
                <h1 id="threadTitle">New conversation</h1>
                <span class="status" id="status">Ready</span>
            </header>
            <section class="chat" id="chat" aria-live="polite"></section>
            <form class="composer" id="composer">
                <input id="fileInput" type="file" accept="{{ supported_file_extensions }}" hidden>
                <button id="attachButton" class="attach-button" type="button" title="Upload a document" aria-label="Upload a document">
                    <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M12 5v14M5 12h14" /></svg>
                </button>
                <textarea id="messageInput" maxlength="{{ max_user_message_length }}" rows="1" autocomplete="off" placeholder="Ask anything..." aria-label="Message"></textarea>
                <button id="sendButton" type="submit">Send</button>
            </form>
        </main>
    </div>
    <script type="module">
        import { createThread, deleteThread, formatDate, getGeneratingThreads, getMessages, getThreads, sendMessage, uploadFile } from "/static/utils.js?v=5";

        const chat = document.querySelector("#chat");
        const threadList = document.querySelector("#threadList");
        const input = document.querySelector("#messageInput");
        const composer = document.querySelector("#composer");
        const sendButton = document.querySelector("#sendButton");
        const attachButton = document.querySelector("#attachButton");
        const fileInput = document.querySelector("#fileInput");
        const newThreadButton = document.querySelector("#newThread");
        const title = document.querySelector("#threadTitle");
        const status = document.querySelector("#status");
        let activeThread = null;
        let threads = [];
        let busy = false;
        let uploading = false;

        const delay = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));

        function resizeMessageInput() {
            input.style.height = "auto";
            const maxHeight = 180;
            input.style.height = `${Math.min(input.scrollHeight, maxHeight)}px`;
            input.style.overflowY = input.scrollHeight > maxHeight ? "auto" : "hidden";
        }

        input.addEventListener("keydown", event => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                composer.requestSubmit();
            }
        });
        input.addEventListener("input", resizeMessageInput);
        resizeMessageInput();
        attachButton.onclick = () => {
            if (!busy && !uploading) fileInput.click();
        };

        function showEmpty() {
            chat.innerHTML = `<div class="empty"><h2>What will we explore?</h2><p>Start a conversation. Your threads and context will stay together here.</p></div>`;
        }

        function renderMessages(messages) {
            chat.innerHTML = "";
            if (!messages.length) return showEmpty();
            messages.forEach(renderMessage);
            chat.scrollTop = chat.scrollHeight;
        }

        function renderMessage(message) {
            const item = document.createElement("article");
            item.className = `message ${message.role}`;
            const label = message.role === "user" ? "You" : "AI";
            const tools = message.tool_invocations?.length
                ? `<div class="tool-use">Used: ${message.tool_invocations.map(tool => escapeHtml(tool.name)).join(", ")}</div>`
                : "";
            item.innerHTML = `<div class="avatar">${label}</div><div class="message-content">${escapeHtml(message.content)}${tools}</div>`;
            chat.appendChild(item);
        }

        function renderGeneratingResponse() {
            const activity = document.createElement("article");
            activity.className = "message assistant activity";
            activity.innerHTML = `<div class="avatar">AI</div><div class="message-content"></div>`;
            activity.querySelector(".message-content").textContent = "Generating response...";
            chat.appendChild(activity);
            chat.scrollTop = chat.scrollHeight;
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[character]);
        }

        function renderThreads(nextThreads) {
            threads = nextThreads;
            threadList.innerHTML = "";
            [...threads].sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at)).forEach(thread => {
                const row = document.createElement("div");
                row.className = "thread-row";

                const selectButton = document.createElement("button");
                selectButton.className = `thread ${thread.id === activeThread ? "active" : ""}`;
                selectButton.textContent = thread.title;
                selectButton.title = `${thread.title} - ${formatDate(thread.updated_at)}`;
                selectButton.onclick = () => selectThread(thread.id, thread.title);

                const deleteButton = document.createElement("button");
                deleteButton.className = "delete-thread";
                deleteButton.type = "button";
                deleteButton.innerHTML = `<svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" /></svg>`;
                deleteButton.title = `Delete ${thread.title}`;
                deleteButton.setAttribute("aria-label", `Delete ${thread.title}`);
                deleteButton.onclick = event => {
                    event.stopPropagation();
                    removeThread(thread);
                };

                row.append(selectButton, deleteButton);
                threadList.appendChild(row);
            });
            setNavigationDisabled(busy);
        }

        function setNavigationDisabled(disabled) {
            newThreadButton.disabled = disabled;
            newThreadButton.classList.toggle("navigation-disabled", disabled);
            threadList.classList.toggle("navigation-disabled", disabled);
            threadList.querySelectorAll("button").forEach(button => {
                button.disabled = disabled;
            });
        }

        function setUploadDisabled(disabled) {
            attachButton.disabled = disabled;
            attachButton.classList.toggle("navigation-disabled", disabled);
        }

        fileInput.onchange = async () => {
            const file = fileInput.files[0];
            if (!file || busy || uploading) return;

            uploading = true;
            setUploadDisabled(true);
            status.textContent = "Uploading";
            try {
                const supportedExtensions = "{{ supported_file_extensions }}".split(",");
                const extension = file.name.slice(file.name.lastIndexOf(".")).toLowerCase();
                if (!supportedExtensions.includes(extension)) {
                    throw new Error(`Unsupported file type. Supported types: ${supportedExtensions.map(extension => extension.slice(1).toUpperCase()).join(", ")}.`);
                }
                if (!activeThread) {
                    const thread = await createThread(`Uploaded file: ${file.name}`, file.name.slice(0, 53));
                    activeThread = thread.id;
                    title.textContent = thread.title;
                    threads = [thread, ...threads];
                    renderThreads(threads);
                }
                await uploadFile(activeThread, file);
                status.textContent = `Uploaded ${file.name}`;
                threads = await getThreads();
                renderThreads(threads);
            } catch (error) {
                status.textContent = error.message;
            } finally {
                fileInput.value = "";
                uploading = false;
                setUploadDisabled(false);
            }
        };

        async function removeThread(thread) {
            if (busy) return;
            if (!window.confirm(`Delete "${thread.title}"? This cannot be undone.`)) return;
            status.textContent = "Deleting";
            try {
                await deleteThread(thread.id);
                threads = threads.filter(item => item.id !== thread.id);
                if (activeThread === thread.id) {
                    activeThread = null;
                    title.textContent = "New conversation";
                    showEmpty();
                }
                renderThreads(threads);
                status.textContent = "Ready";
            } catch (error) {
                status.textContent = error.message;
            }
        }

        async function selectThread(threadId, threadTitle, allowWhileBusy = false) {
            if (busy && !allowWhileBusy) return;
            activeThread = threadId;
            title.textContent = threadTitle;
            status.textContent = "Loading";
            renderThreads(threads);
            renderMessages(await getMessages(threadId));
            status.textContent = "Ready";
        }

        async function waitForGeneration(generatingThreadIds) {
            const pendingThreadIds = new Set(generatingThreadIds);

            while (pendingThreadIds.size > 0) {
                await delay(500);

                const currentThreadIds = new Set(await getGeneratingThreads());

                for (const threadId of pendingThreadIds) {
                    if (currentThreadIds.has(threadId)) continue;

                    if (threadId === activeThread) {
                        renderMessages(await getMessages(activeThread));
                    }

                    pendingThreadIds.delete(threadId);
                }
            }

            threads = (await getThreads()).sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
            renderThreads(threads);
            busy = false;
            sendButton.disabled = false;
            setNavigationDisabled(false);
            status.textContent = "Ready";
        }

        newThreadButton.onclick = () => {
            if (busy || uploading) return;
            activeThread = null;
            title.textContent = "New conversation";
            status.textContent = "Ready";
            renderThreads(threads);
            showEmpty();
            input.focus();
        };

        composer.onsubmit = async event => {
            event.preventDefault();
            const message = input.value.trim();
            if (!message || busy || uploading) return;
            busy = true;
            sendButton.disabled = true;
            setNavigationDisabled(true);
            input.value = "";
            resizeMessageInput();
            if (chat.querySelector(".empty")) chat.innerHTML = "";
            renderMessage({ role: "user", content: message });
            renderGeneratingResponse();
            const activity = chat.lastElementChild;
            status.textContent = "Thinking";
            try {
                if (!activeThread) {
                    const thread = await createThread(message);
                    activeThread = thread.id;
                    title.textContent = thread.title;
                    threads = [thread, ...threads];
                    renderThreads(threads);
                }
                const result = await sendMessage(activeThread, message);
                activity.remove();
                result.slice(1).forEach(renderMessage);
                renderThreads(await getThreads());
                status.textContent = "Ready";
            } catch (error) {
                activity.classList.remove("activity");  // NOTE : Remove the "activity" class to indicate that the response generation has failed. Now the "The request could not be completed." is not in changing opacity text.
                activity.querySelector(".message-content").textContent = error.message;
                activity.style.color = "#b84b31";
                status.textContent = "Error";
            } finally {
                busy = false;
                sendButton.disabled = false;
                setNavigationDisabled(false);
                input.focus();
            }
        };

        try {
            const [loadedThreads, generatingThreadIds] = await Promise.all([
                getThreads(),
                getGeneratingThreads(),
            ]);
            threads = loadedThreads.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
            busy = generatingThreadIds.length > 0;
            renderThreads(threads);
            if (threads.length) await selectThread(threads[0].id, threads[0].title, true);
            else showEmpty();
            if (busy) {
                if (activeThread && generatingThreadIds.includes(activeThread)) {
                    renderGeneratingResponse();
                }
                sendButton.disabled = true;
                setNavigationDisabled(true);
                status.textContent = "Thinking";
                waitForGeneration(generatingThreadIds).catch(error => {
                    busy = false;
                    sendButton.disabled = false;
                    setNavigationDisabled(false);
                    status.textContent = error.message;
                });
            }
        } catch (error) {
            status.textContent = error.message;
            showEmpty();
        }
    </script>
</body>
</html>
