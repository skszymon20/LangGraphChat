<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangGraphChat</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #343541; color: #fff; display: flex; flex-direction: column; height: 100vh; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 8px; line-height: 1.4; }
        .user { align-self: flex-end; background: #444654; }
        .bot { align-self: flex-start; background: #0e0e10; }
        #input-area { padding: 20px; background: #40414f; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: none; border-radius: 5px; background: #40414f; color: white; border: 1px solid #565869; }
        button { padding: 12px 20px; border: none; border-radius: 5px; background: #19c37d; color: white; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="chat">
        <div class="msg bot">Hello! How can I help you today?</div>
    </div>

    <div id="input-area">
        <input type="text" id="msgInput" placeholder="Send a message..." onkeydown="if(event.key === 'Enter') send()">
        <button onclick="send()">Send</button>
    </div>

    <script>
        async function send() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            input.value = '';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                appendMessage(data.reply, 'bot');
            } catch (error) {
                appendMessage('Error connecting to server.', 'bot');
            }
        }

        function appendMessage(text, sender) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
